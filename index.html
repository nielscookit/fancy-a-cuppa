
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fancy a Cuppa">
<title>Fancy a Cuppa</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#191919;background:#faf9f6}
*{box-sizing:border-box}
body{margin:0}
main{max-width:480px;margin:auto;padding:30px 20px 50px}
header{text-align:center;margin-bottom:30px}
h1{font-family:Georgia,serif;font-weight:normal;font-size:clamp(43px,11vw,58px);letter-spacing:-2px;margin:8px 0}
p{color:#777;font-size:13px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#777}
.panel{background:white;border:1px solid #eceae7;border-radius:22px;padding:20px;margin:13px 0}
.label{font-size:11px;font-weight:750;letter-spacing:1.5px;text-transform:uppercase;color:#777;margin-bottom:13px}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.tabs{display:flex;background:#f2f1ef;border-radius:12px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:12px;font-weight:600}
.tabs .active{background:#191919;color:white}
.teas{display:grid;gap:8px;margin-top:16px}
.tea{width:100%;padding:13px;border:1px solid #e8e7e4;border-radius:12px;background:white;text-align:left}
.tea strong{display:block;font-size:14px}
.tea small{display:block;color:#888;margin-top:4px}
.tea.active{border-color:#ed433b;background:#fff7f6}
.stepper{display:flex;align-items:center;justify-content:center;gap:20px;margin:16px 0}
.stepper button{height:46px;width:46px;border-radius:50%;background:#f5f4f2;border:1px solid #e5e4e1;font-size:24px}
.amount{font-size:27px;font-weight:650;min-width:125px;text-align:center}
.note{text-align:center;font-size:12px;color:#888}
.dose{text-align:center;font-family:Georgia,serif;font-size:27px;margin:18px 0 5px}
.choices{display:flex;gap:8px;margin-top:14px}
.choices button{flex:1;padding:12px;border:1px solid #ddd;background:white;border-radius:12px;font-weight:650}
.choices .active{background:#191919;color:white}
.hidden{display:none}
.timer{text-align:center;padding:22px 0}
.dial{width:min(285px,85vw);aspect-ratio:1;margin:10px auto;position:relative}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:7}
.track{stroke:#eee}
.progress{stroke:#ed433b;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.clock{font-size:55px;font-weight:600;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.state{font-size:12px;color:#888;margin-top:8px}
.controls{display:flex;gap:9px}
.controls button{border:0;border-radius:13px;padding:15px;font-weight:700}
.primary{flex:1;background:#ed433b;color:white}
.secondary{background:#f0efec;color:#222}
.test{width:100%;margin-top:12px;padding:13px;border:1px solid #ddd;border-radius:12px;background:white;font-weight:600}
footer{text-align:center;color:#999;font-size:11px;margin-top:25px;line-height:1.6}
</style>
</head>
<body>
<main>
<header>
<div class="eyebrow">Your daily tea ritual</div>
<h1>Fancy a <i>Cuppa?</i></h1>
<p>Dein persönlicher Tee-Timer.</p>
</header>

<section class="panel">
<div class="label">01 / Zubereitung</div>
<div class="tabs">
<button id="looseTab" class="active">Loser Tee</button>
<button id="bagTab">Beuteltee</button>
</div>
<div class="label" style="margin-top:23px">02 / Tee auswählen</div>
<div id="teas" class="teas"></div>
</section>

<section class="panel">
<div id="amountTitle" class="label">03 / Wassermenge</div>
<div class="stepper">
<button id="minus" aria-label="Weniger">−</button>
<div id="amount" class="amount">600 ml</div>
<button id="plus" aria-label="Mehr">+</button>
</div>
<div id="amountNote" class="note"></div>
<hr style="border:0;border-top:1px solid #eee;margin:20px 0">
<div class="label">Dosierung</div>
<div id="dose" class="dose"></div>
<div id="doseNote" class="note"></div>
<div id="timeChooser" class="hidden">
<div class="label" style="margin-top:22px">Ziehzeit</div>
<div class="choices">
<button data-min="2">2 Minuten</button>
<button data-min="3">3 Minuten</button>
</div>
</div>
</section>

<section class="timer">
<div class="eyebrow">Brewing time</div>
<div class="dial">
<svg viewBox="0 0 240 240" aria-hidden="true">
<circle class="track" cx="120" cy="120" r="105"/>
<circle id="progress" class="progress" cx="120" cy="120" r="105"/>
</svg>
<div class="center">
<div id="clock" class="clock">04:00</div>
<div id="state" class="state" role="status">Bereit zum Aufgießen</div>
</div>
</div>
<div class="controls">
<button id="start" class="primary">▶ Starten</button>
<button id="reset" class="secondary">↺ Reset</button>
</div>
<button id="testSound" class="test">▶ Stimme testen</button>
</section>
<footer>Nach Ablauf den Tee entfernen.<br>Für die Sprachausgabe App geöffnet lassen.</footer>
</main>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const teas={
loose:[
{name:"Assam CTC Tinsukia",sub:"TeaGschwendner · Nr. 109",min:4},
{name:"Assam Brahmaputra Malty",sub:"TeaGschwendner · Nr. 125",min:5},
{name:"Traditional Afternoon",sub:"Williamson · Kenia",min:4}
],
bag:[
{name:"Tetley",sub:"Schwarzer Beuteltee",min:3},
{name:"PG Tips",sub:"Schwarzer Beuteltee",min:3}
]};
let mode="loose",selected={loose:0,bag:0};
let ml=600,cups=2,bagMin=3;
let total=240,remaining=240,running=false,deadline=0,ticker=null;
const voice=new Audio("./tea-finished.mp3");
voice.preload="auto";
const circumference=2*Math.PI*105;
$("progress").style.strokeDasharray=circumference;

function minutes(){
return mode==="bag"?bagMin:teas.loose[selected.loose].min;
}
function draw(){
const sec=Math.max(0,Math.ceil(remaining));
$("clock").textContent=
String(Math.floor(sec/60)).padStart(2,"0")+":"+
String(sec%60).padStart(2,"0");
$("progress").style.strokeDashoffset=
circumference*(1-Math.max(0,Math.min(1,remaining/total)));
}
function stop(){
running=false;
clearInterval(ticker);
ticker=null;
$("start").textContent="▶ Starten";
}
function reset(){
stop();
remaining=total=minutes()*60;
$("state").textContent="Bereit zum Aufgießen";
draw();
}
function render(){
$("looseTab").classList.toggle("active",mode==="loose");
$("bagTab").classList.toggle("active",mode==="bag");
$("teas").replaceChildren();
teas[mode].forEach((tea,i)=>{
const b=document.createElement("button");
b.className="tea"+(selected[mode]===i?" active":"");
b.innerHTML="<strong></strong><small></small>";
b.querySelector("strong").textContent=tea.name;
b.querySelector("small").textContent=tea.sub;
b.onclick=()=>{selected[mode]=i;render()};
$("teas").append(b);
});
const bag=mode==="bag";
$("amountTitle").textContent=bag?"03 / Anzahl Tassen":"03 / Wassermenge";
$("amount").textContent=bag?cups+(cups===1?" Tasse":" Tassen"):ml+" ml";
$("amountNote").textContent=bag?
"1 Tasse = 250 ml · 1 Beutel":"100-ml-Schritte";
$("dose").textContent=bag?
cups+(cups===1?" Teebeutel":" Teebeutel"):
(ml*0.006).toLocaleString("de-DE",{maximumFractionDigits:1})+" Teemaß";
$("doseNote").textContent=bag?
(cups*250)+" ml Wasser insgesamt":
"Gestrichenes TeaGschwendner-Teemaß";
$("timeChooser").classList.toggle("hidden",!bag);
document.querySelectorAll("[data-min]").forEach(b=>
b.classList.toggle("active",Number(b.dataset.min)===bagMin));
$("minus").disabled=bag?cups<=1:ml<=100;
$("plus").disabled=bag?cups>=12:ml>=2000;
reset();
}
$("looseTab").onclick=()=>{mode="loose";render()};
$("bagTab").onclick=()=>{mode="bag";render()};
$("minus").onclick=()=>{
if(mode==="bag")cups=Math.max(1,cups-1);
else ml=Math.max(100,ml-100);
render();
};
$("plus").onclick=()=>{
if(mode==="bag")cups=Math.min(12,cups+1);
else ml=Math.min(2000,ml+100);
render();
};
document.querySelectorAll("[data-min]").forEach(b=>{
b.onclick=()=>{bagMin=Number(b.dataset.min);render()};
});
function playVoice(){
voice.pause();
voice.currentTime=0;
voice.muted=false;
voice.volume=1;
return voice.play();
}
$("testSound").onclick=()=>{
playVoice().then(()=>{
$("state").textContent="Sprachdatei wird abgespielt";
}).catch(()=>{
$("state").textContent="Audio konnte nicht abgespielt werden";
});
};
function tick(){
remaining=Math.max(0,(deadline-Date.now())/1000);
draw();
if(remaining<=0){
stop();
$("state").textContent="Tee fertig – jetzt entfernen!";
playVoice().catch(()=>{
$("state").textContent="Tee fertig – Audio blockiert";
});
}
}
$("start").onclick=()=>{
if(running){
tick();
stop();
$("state").textContent="Pausiert";
return;
}
if(remaining<=0)remaining=total;
voice.pause();
voice.currentTime=0;
voice.muted=true;
const unlock=voice.play();
if(unlock&&unlock.then){
unlock.then(()=>{
voice.pause();
voice.currentTime=0;
voice.muted=false;
}).catch(()=>{voice.muted=false});
}
running=true;
deadline=Date.now()+remaining*1000;
$("start").textContent="Ⅱ Pausieren";
$("state").textContent="Dein Tee zieht …";
tick();
ticker=setInterval(tick,200);
};
$("reset").onclick=reset;
document.addEventListener("visibilitychange",()=>{
if(!document.hidden&&running)tick();
});
render();
})();
</script>
</body>
</html>
