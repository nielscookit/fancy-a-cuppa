<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fancy a Cuppa">
<title>Fancy a Cuppa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{font-family:"Roboto Mono",monospace;color:#1d1d1d;background:#faf9f6;font-size:13px}
*{box-sizing:border-box}
body{margin:0}
main{max-width:480px;margin:auto;padding:28px 20px max(45px,env(safe-area-inset-bottom))}
header{text-align:center;margin:0 0 24px}
h1{font-size:22px;font-weight:500;letter-spacing:-1px;margin:0}
.timer{text-align:center}
.dial{width:min(285px,82vw);aspect-ratio:1;margin:8px auto 15px;position:relative}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:6}
.track{stroke:#e9e7e3}
.progress{stroke:#e34840;stroke-linecap:round;transition:stroke-dashoffset .18s linear}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.clock{font-family:Roboto,Arial,sans-serif;font-size:clamp(54px,14vw,68px);font-weight:700;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.state{font-size:14px;font-weight:500;letter-spacing:1.7px;color:#777}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid #e34840;outline-offset:3px}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:12px 0 20px}
.round{height:44px;width:44px;border:1px solid #dfdcd7;background:#fff;border-radius:50%;font-size:23px;line-height:1}
.round:disabled{opacity:.35}
.minute-label{min-width:80px;text-align:center;font-weight:500}
.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:13px}
.preset{padding:13px 2px;background:#fff;border:1px solid #e5e1dc;border-radius:12px;font-size:12px;font-weight:500}
.preset.active{background:#222;color:#fff;border-color:#222}
.actions{display:flex;gap:9px}
.primary{flex:1;background:#e34840;color:white;border:0;border-radius:13px;padding:16px 12px;font-weight:600;min-height:52px}
.secondary{background:#eeeae6;color:#222;border:0;border-radius:13px;padding:14px 17px;font-weight:500}
.secondary[hidden]{display:none}
.message{min-height:20px;margin:14px 0 0;text-align:center;font-size:12px;color:#777}
.divider{height:1px;background:#e8e5e0;margin:27px 0 20px}
.test{width:100%;padding:13px;border:1px solid #e5e1dc;border-radius:12px;background:#fff;color:#555;font-size:12px}
footer{text-align:center;color:#999;font-size:11px;line-height:1.7;margin-top:18px}
@media(prefers-reduced-motion:reduce){.progress{transition:none}}
</style>
</head>
<body>
<main>
<header><h1>Fancy a Cuppa</h1></header>
<section class="timer" aria-label="Tee-Timer">
<div class="dial">
<svg viewBox="0 0 240 240" aria-hidden="true">
<circle class="track" cx="120" cy="120" r="105"></circle>
<circle id="progress" class="progress" cx="120" cy="120" r="105"></circle>
</svg>
<div class="center">
<div id="clock" class="clock" role="timer" aria-label="Verbleibende Zeit">04:00</div>
<div id="state" class="state">BREW TIME</div>
</div>
</div>
<div class="stepper">
<button id="minus" class="round" type="button" aria-label="Eine Minute weniger">−</button>
<div id="minuteLabel" class="minute-label">4 MIN</div>
<button id="plus" class="round" type="button" aria-label="Eine Minute mehr">+</button>
</div>
<div class="presets" role="group" aria-label="Ziehzeit wählen">
<button type="button" class="preset" data-min="2">2 MIN</button>
<button type="button" class="preset" data-min="3">3 MIN</button>
<button type="button" class="preset" data-min="4">4 MIN</button>
<button type="button" class="preset" data-min="5">5 MIN</button>
</div>
<div class="actions">
<button id="start" type="button" class="primary">▶ TIMER STARTEN</button>
<button id="reset" type="button" class="secondary" hidden>↺ RESET</button>
</div>
<p id="message" class="message" role="status" aria-live="polite"></p>
</section>
<div class="divider"></div>
<button id="testSound" type="button" class="test">▶ STIMME TESTEN</button>
<footer>Die Sprachausgabe kann durch iOS eingeschränkt sein.<br>Für eine zuverlässigere Wiedergabe die App geöffnet lassen.</footer>
</main>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const circumference=2*Math.PI*105;
$("progress").style.strokeDasharray=String(circumference);
const voice=new Audio("./tea-finished.mp3");
voice.preload="auto";
let chosen=4,total=240,remaining=240,deadline=0,running=false,finished=false,ticker=null;
function clock(sec){
const n=Math.max(0,Math.ceil(sec));
return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
}
function draw(){
$("clock").textContent=clock(remaining);
$("progress").style.strokeDashoffset=String(circumference*(1-Math.min(1,Math.max(0,remaining/total))));
$("minuteLabel").textContent=chosen+" MIN";
document.querySelectorAll(".preset").forEach(b=>{
const active=Number(b.dataset.min)===chosen;
b.classList.toggle("active",active);
b.setAttribute("aria-pressed",String(active));
});
$("minus").disabled=chosen<=1;
$("plus").disabled=chosen>=60;
$("start").textContent=running?"Ⅱ PAUSIEREN":finished?"↺ NEU STARTEN":remaining<total?"▶ FORTSETZEN":"▶ TIMER STARTEN";
$("reset").hidden=!(running||remaining<total||finished);
$("state").textContent=finished?"TEA IS READY":running?"BREWING":"BREW TIME";
}
function clearTicker(){if(ticker!==null){clearInterval(ticker);ticker=null;}}
function stop(){clearTicker();running=false;}
function setTime(min){
stop();chosen=Math.max(1,Math.min(60,min));total=remaining=chosen*60;finished=false;
$("message").textContent="";
draw();
}
function reset(){setTime(chosen);}
function playVoice(){
voice.pause();voice.currentTime=0;voice.muted=false;voice.volume=1;
return voice.play();
}
function unlockVoice(){
voice.pause();voice.currentTime=0;voice.muted=true;
const p=voice.play();
if(p&&typeof p.then==="function"){
p.then(()=>{voice.pause();voice.currentTime=0;voice.muted=false;}).catch(()=>{voice.muted=false;});
}else{voice.muted=false;}
}
function tick(){
if(!running)return;
remaining=Math.max(0,(deadline-Date.now())/1000);
if(remaining<=0){
stop();remaining=0;finished=true;
$("message").textContent="Dein Tee ist fertig.";
draw();
playVoice().catch(()=>{$("message").textContent="Dein Tee ist fertig. Sprachausgabe wurde blockiert.";});
return;
}
draw();
}
$("start").addEventListener("click",()=>{
if(running){tick();if(!running)return;stop();$("message").textContent="Pausiert.";draw();return;}
if(finished){remaining=total;finished=false;}
unlockVoice();
running=true;deadline=Date.now()+remaining*1000;
$("message").textContent="";
tick();ticker=setInterval(tick,200);
});
$("reset").addEventListener("click",reset);
$("minus").addEventListener("click",()=>setTime(chosen-1));
$("plus").addEventListener("click",()=>setTime(chosen+1));
document.querySelectorAll(".preset").forEach(b=>b.addEventListener("click",()=>setTime(Number(b.dataset.min))));
$("testSound").addEventListener("click",()=>{
playVoice().then(()=>{$("message").textContent="Sprachdatei wird abgespielt.";})
.catch(()=>{$("message").textContent="Sprachdatei konnte nicht abgespielt werden.";});
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&running)tick();});
draw();
})();
</script>
</body>
</html>
