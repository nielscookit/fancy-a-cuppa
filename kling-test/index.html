<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f6"><title>Fancy a Cuppa — Kling Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#222;font-family:Arial,system-ui,sans-serif}main{max-width:480px;min-height:100dvh;margin:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}header{font-size:13px;color:#777;letter-spacing:.08em;text-transform:uppercase}h1{font-size:24px;margin:8px 0 6px}p{line-height:1.4}.screen{flex:1;display:flex;align-items:center;justify-content:center;min-height:280px}.video-stage{position:relative;width:100%;aspect-ratio:1;overflow:hidden;-webkit-mask-image:radial-gradient(circle closest-side at center,#000 68%,rgba(0,0,0,.92) 77%,rgba(0,0,0,.5) 88%,transparent 100%);mask-image:radial-gradient(circle closest-side at center,#000 68%,rgba(0,0,0,.92) 77%,rgba(0,0,0,.5) 88%,transparent 100%)}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;visibility:hidden}video.active{opacity:1;visibility:visible}#status{font-size:14px;color:#666;min-height:40px;text-align:center}.actions{display:grid;gap:12px}button{min-height:66px;border:0;border-radius:6px;background:#76233c;color:#fff;font-size:18px;font-weight:700;cursor:pointer}button.secondary{background:#252525}button:disabled{opacity:.5}.note{font-size:12px;color:#777;margin-top:16px}
</style></head><body><main><header>Fancy a Cuppa · Testversion</header><h1>Kling-Videotest</h1><div class="screen"><div class="video-stage"><video id="clip0" playsinline muted preload="auto"></video><video id="clip1" playsinline muted preload="auto"></video><video id="clip2" playsinline muted preload="auto" loop></video></div></div><p id="status" role="status">Bereit: Einfüllen → Teeziehen → Idle-Loop</p><div class="actions"><button id="start">TEST STARTEN</button><button class="secondary" id="reset">ZURÜCKSETZEN</button></div><p class="note">Separater Videotest. Die produktive Timer-App bleibt unverändert. Videos werden stumm abgespielt.</p></main>
<script>
const base="https://raw.githubusercontent.com/nielscookit/fancy-a-cuppa/kling-video-test/";
const clips=[base+"FIll.mp4",base+"brew.mp4",base+"still.mp4"];
const names=["Einfüllen","Teeziehen","Idle-Loop"];
const videos=[0,1,2].map(i=>document.getElementById("clip"+i));
const status=document.getElementById("status"),start=document.getElementById("start");
let phase=-1,active=false,transitioning=false;
videos.forEach((v,i)=>{v.src=clips[i];v.muted=true;v.defaultMuted=true;v.preload="auto";v.load();v.addEventListener("error",()=>{if(active&&phase===i)status.textContent="Video konnte nicht geladen werden.";});});
function ready(v){return v.readyState>=2;}
function waitReady(v){if(ready(v))return Promise.resolve();return new Promise((resolve,reject)=>{const done=()=>{cleanup();resolve()},fail=()=>{cleanup();reject(new Error("Video konnte nicht geladen werden"))},cleanup=()=>{v.removeEventListener("loadeddata",done);v.removeEventListener("error",fail)};v.addEventListener("loadeddata",done,{once:true});v.addEventListener("error",fail,{once:true});v.load();});}
async function show(i){
 if(!active||transitioning)return;transitioning=true;
 const next=videos[i],previous=phase>=0?videos[phase]:null;
 status.textContent=names[i]+(i===2?" · wiederholt sich bis zum Stoppen":" · läuft einmal");
 try{
  await waitReady(next);
  if(!active){transitioning=false;return;}
  next.currentTime=0;
  // Start the incoming clip before removing the outgoing last frame.
  await next.play();
  if(!active){next.pause();transitioning=false;return;}
  next.classList.add("active");
  if(previous&&previous!==next){previous.classList.remove("active");previous.pause();}
  phase=i;
 }catch(e){status.textContent="Video konnte nicht starten: "+e.message;start.disabled=false;}
 transitioning=false;
}
videos[0].addEventListener("ended",()=>{if(active)show(1)});
videos[1].addEventListener("ended",()=>{if(active)show(2)});
start.addEventListener("click",async()=>{
 if(active)return;active=true;start.disabled=true;
 status.textContent="Videos werden vorbereitet …";
 try{await Promise.all(videos.map(waitReady));if(active)show(0);}
 catch(e){status.textContent="Ladefehler: "+e.message;active=false;start.disabled=false;}
});
document.getElementById("reset").addEventListener("click",()=>{
 active=false;transitioning=false;phase=-1;
 videos.forEach(v=>{v.pause();v.classList.remove("active");try{v.currentTime=0}catch(e){}});
 start.disabled=false;status.textContent="Bereit: Einfüllen → Teeziehen → Idle-Loop";
});
</script></body></html>
