<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f6"><title>Fancy a Cuppa — Kling Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#222;font-family:Arial,system-ui,sans-serif}main{max-width:480px;min-height:100dvh;margin:auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}header{font-size:13px;color:#777;letter-spacing:.08em;text-transform:uppercase}h1{font-size:24px;margin:8px 0 6px}p{line-height:1.4}.screen{flex:1;display:flex;align-items:center;justify-content:center;min-height:280px}video{width:100%;aspect-ratio:1;object-fit:contain;background:#faf9f6}#status{font-size:14px;color:#666;min-height:40px;text-align:center}.actions{display:grid;gap:12px}button{min-height:66px;border:0;border-radius:6px;background:#76233c;color:#fff;font-size:18px;font-weight:700;cursor:pointer}button.secondary{background:#252525}button:disabled{opacity:.5}.note{font-size:12px;color:#777;margin-top:16px}
</style></head><body><main><header>Fancy a Cuppa · Testversion</header><h1>Kling-Videotest</h1><div class="screen"><video id="video" playsinline muted preload="auto"></video></div><p id="status" role="status">Bereit: Einfüllen → Teeziehen → Idle-Loop</p><div class="actions"><button id="start">TEST STARTEN</button><button class="secondary" id="reset">ZURÜCKSETZEN</button></div><p class="note">Separater Videotest. Die produktive Timer-App bleibt unverändert. Videos werden stumm abgespielt.</p></main>
<script>
const base="https://raw.githubusercontent.com/nielscookit/fancy-a-cuppa/kling-video-test/";
const clips=[base+"FIll.mp4",base+"brew.mp4",base+"still.mp4"];
const names=["Einfüllen","Teeziehen","Idle-Loop"];
const video=document.getElementById("video"),status=document.getElementById("status"),start=document.getElementById("start");
let phase=-1,active=false;
function next(i){if(!active)return;phase=i;video.pause();video.loop=i===2;video.src=clips[i];video.muted=true;video.defaultMuted=true;status.textContent=names[i]+(i===2?" · wiederholt sich bis zum Stoppen":" · läuft einmal");video.play().catch(e=>{status.textContent="Video konnte nicht starten: "+e.message;start.disabled=false;});}
video.addEventListener("ended",()=>{if(active&&phase<2)next(phase+1)});
video.addEventListener("error",()=>{status.textContent="Video konnte nicht geladen werden. Bitte Verbindung prüfen.";start.disabled=false;});
start.addEventListener("click",()=>{active=true;start.disabled=true;next(0)});
document.getElementById("reset").addEventListener("click",()=>{active=false;phase=-1;video.pause();video.removeAttribute("src");video.load();start.disabled=false;status.textContent="Bereit: Einfüllen → Teeziehen → Idle-Loop"});
</script></body></html>
